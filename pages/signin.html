<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <img src="../assets/coding.png" alt="Boy coding on a skull laptop" />
      <h1>Join Coders Now!</h1>
      <form action="signin.html" method="post">
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Email"
          required
        />
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Password"
          required
        />
        <button type="submit">Log in</button>
      </form>
    </main>

    <section>
      <p>New to CodeLabs? <a href="signup.html">Sign up now</a></p>
    </section>
  </body>
</html>
