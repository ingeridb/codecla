<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style.css" />
    <title>Document</title>
  </head>
  <body>
    <main class="signin">
      <section class="boy-side">
        <img src="../assets/coding.png" alt="Boy coding on a skull laptop" />
      </section>
      <section class="form-side">
        <div class="form-box">
          <h1>Join Coders Now!</h1>
          <form class="sign-form" action="signin.html" method="post">
            <input
              class="form-input"
              type="text"
              id="firstName"
              name="firstName"
              placeholder="Name"
              required
            />
            <input
              class="form-input"
              type="text"
              id="lastName"
              name="lastName"
              placeholder="Last Name"
              required
            />
            <input
              class="form-input"
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              required
            />
            <input
              class="form-input"
              type="password"
              id="password"
              name="password"
              placeholder="Password"
              required
            />
            <button class="sign-btn" type="submit">Sign up</button>
          </form>
          <p>Already have an account? <a href="signin.html">Login</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
