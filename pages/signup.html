<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <section>
      <img src="../assets/coding.png" alt="Boy coding on a skull laptop" />
      <h1>Join Coders Now!</h1>
      <form action="signin.html" method="post">
        <input
          type="text"
          id="firstName"
          name="firstName"
          placeholder="Name"
          required
        />
        <input
          type="text"
          id="lastName"
          name="lastName"
          placeholder="Last Name"
          required
        />
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Email"
          required
        />
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Password"
          required
        />
        <button type="submit">Sign up</button>
      </form>
    </section>

    <section>
      <p>Already have an account? <a href="signin.html">Login</a></p>
    </section>
  </body>
</html>
